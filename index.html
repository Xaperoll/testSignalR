<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>360 Панорама - Съёмка</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        #camera-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        /* Затемнение по краям для лучшего фокуса */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.5) 100%);
        }
        /* Кружки для наведения */
        .target-dot {
            position: absolute;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.9);
            background: rgba(255, 255, 255, 0.15);
            width: 80px;
            height: 80px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            box-shadow: 0 0 30px rgba(0, 150, 255, 0.3);
            transition: all 0.2s ease;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: rgba(255,255,255,0.7);
            text-align: center;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        .target-dot.active {
            border-color: #00ff88;
            background: rgba(0, 255, 136, 0.25);
            box-shadow: 0 0 50px rgba(0, 255, 136, 0.5);
            transform: translate(-50%, -50%) scale(1.1);
        }
        .target-dot.done {
            border-color: #00ff88;
            background: rgba(0, 255, 136, 0.4);
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.3);
        }
        .target-dot .num {
            font-size: 20px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 20px rgba(0,0,0,0.9);
        }
        .target-dot .status-icon {
            position: absolute;
            bottom: -25px;
            font-size: 14px;
            background: rgba(0,0,0,0.7);
            padding: 2px 10px;
            border-radius: 10px;
            white-space: nowrap;
        }
        /* UI элементы */
        #ui {
            position: absolute;
            bottom: 40px;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            z-index: 20;
            pointer-events: none;
            padding: 0 20px;
        }
        #ui > * {
            pointer-events: auto;
        }
        #progress-bar {
            width: 90%;
            max-width: 400px;
            height: 6px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        #progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00ff88, #00ccff);
            border-radius: 3px;
            transition: width 0.3s ease;
        }
        #status-text {
            font-size: 14px;
            color: rgba(255,255,255,0.8);
            background: rgba(0,0,0,0.6);
            padding: 8px 20px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            font-weight: 500;
            letter-spacing: 0.5px;
            text-align: center;
        }
        #btn-panel {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            pointer-events: auto;
        }
        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 2px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            min-width: 120px;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn-primary {
            background: #00ccff;
            color: #000;
            border-color: #00ccff;
            box-shadow: 0 0 30px rgba(0, 204, 255, 0.3);
        }
        .btn-primary:active {
            box-shadow: 0 0 60px rgba(0, 204, 255, 0.5);
        }
        .btn-success {
            background: #00ff88;
            color: #000;
            border-color: #00ff88;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
        }
        .btn-danger {
            background: #ff4466;
            color: #fff;
            border-color: #ff4466;
        }
        .btn:disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        #result-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
            backdrop-filter: blur(20px);
        }
        #result-panel.show {
            display: flex;
        }
        #result-panel h2 {
            font-size: 28px;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00ff88, #00ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #result-panel .sub {
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            margin-bottom: 20px;
        }
        #panorama-result {
            max-width: 100%;
            max-height: 40vh;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
            object-fit: contain;
            background: #111;
        }
        #thumbnails {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            max-width: 600px;
            max-height: 30vh;
            overflow-y: auto;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
        }
        #thumbnails img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid rgba(255,255,255,0.1);
            transition: transform 0.2s;
            cursor: pointer;
        }
        #thumbnails img:hover {
            transform: scale(1.1);
        }
        #result-btns {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn-close {
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            color: #fff;
        }
        .btn-download {
            background: #00ff88;
            color: #000;
            border-color: #00ff88;
        }
        #guide-text {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            background: rgba(0,0,0,0.7);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
            white-space: nowrap;
            pointer-events: none;
        }
        @media (max-width: 600px) {
            .target-dot {
                width: 60px;
                height: 60px;
            }
            .target-dot .num {
                font-size: 16px;
            }
            .btn {
                padding: 10px 20px;
                font-size: 14px;
                min-width: 90px;
            }
            #guide-text {
                font-size: 12px;
                padding: 6px 14px;
                top: 10px;
            }
        }
    </style>
</head>
<body>

    <div id="camera-container">
        <video id="video" autoplay playsinline></video>
        <div id="overlay"></div>
        <div id="guide-text">📸 Наведи камеру на кружок → автосъёмка</div>
        
        <!-- Сюда будут динамически добавляться кружки -->
        <div id="dots-container"></div>

        <div id="ui">
            <div id="progress-bar">
                <div id="progress-fill"></div>
            </div>
            <div id="status-text">Готов к съёмке</div>
            <div id="btn-panel">
                <button class="btn btn-danger" id="btn-reset">↺ Сброс</button>
                <button class="btn btn-primary" id="btn-auto">▶ Авто</button>
                <button class="btn btn-success" id="btn-finish">✅ Завершить</button>
            </div>
        </div>
    </div>

    <!-- Панель результата -->
    <div id="result-panel">
        <h2>🎉 Панорама готова!</h2>
        <p class="sub">Склеенная панорама + все оригинальные кадры</p>
        <img id="panorama-result" src="" alt="Панорама">
        <div id="thumbnails"></div>
        <div id="result-btns">
            <button class="btn btn-download" id="btn-download-all">📥 Скачать всё (ZIP)</button>
            <button class="btn btn-close" id="btn-close-result">✕ Закрыть</button>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ---------- Конфигурация ----------
            const TOTAL_SHOTS = 8; // Количество кружков (кадров)
            const CAPTURE_DELAY = 300; // мс задержки для стабилизации
            const DOT_RADIUS = 60; // радиус зоны захвата (пикселей)

            // ---------- Состояние ----------
            let photos = []; // массив { blob, url, index }
            let captured = new Array(TOTAL_SHOTS).fill(false);
            let videoStream = null;
            let isAutoMode = false;
            let autoTimer = null;
            let isCapturing = false;
            let isInitialized = false;

            // DOM
            const video = document.getElementById('video');
            const dotsContainer = document.getElementById('dots-container');
            const progressFill = document.getElementById('progress-fill');
            const statusText = document.getElementById('status-text');
            const btnReset = document.getElementById('btn-reset');
            const btnAuto = document.getElementById('btn-auto');
            const btnFinish = document.getElementById('btn-finish');
            const resultPanel = document.getElementById('result-panel');
            const panoramaImg = document.getElementById('panorama-result');
            const thumbnailsDiv = document.getElementById('thumbnails');
            const btnCloseResult = document.getElementById('btn-close-result');
            const btnDownloadAll = document.getElementById('btn-download-all');
            const guideText = document.getElementById('guide-text');

            // ---------- Инициализация камеры ----------
            async function initCamera() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { 
                            facingMode: 'environment',
                            width: { ideal: 1280 },
                            height: { ideal: 720 }
                        },
                        audio: false
                    });
                    videoStream = stream;
                    video.srcObject = stream;
                    await video.play();
                    isInitialized = true;
                    updateStatus('Камера готова. Наводи на кружки!');
                    generateDots();
                    return true;
                } catch (err) {
                    console.error('Ошибка камеры:', err);
                    updateStatus('❌ Не удалось получить доступ к камере');
                    alert('Пожалуйста, разрешите доступ к камере и обновите страницу.');
                    return false;
                }
            }

            // ---------- Генерация кружков (сетка) ----------
            function generateDots() {
                dotsContainer.innerHTML = '';
                const positions = getGridPositions(TOTAL_SHOTS);
                for (let i = 0; i < TOTAL_SHOTS; i++) {
                    const dot = document.createElement('div');
                    dot.className = 'target-dot';
                    dot.dataset.index = i;
                    dot.style.left = positions[i].x + '%';
                    dot.style.top = positions[i].y + '%';
                    dot.innerHTML = `<span class="num">${i + 1}</span><span class="status-icon">⏳</span>`;
                    dotsContainer.appendChild(dot);
                }
                updateDotsUI();
            }

            // Позиции кружков по спирали/сетке (для равномерного покрытия)
            function getGridPositions(count) {
                const positions = [];
                // Спираль Фибоначчи или равномерная сетка
                const cols = Math.ceil(Math.sqrt(count));
                const rows = Math.ceil(count / cols);
                const margin = 12; // отступ от края %
                const spacingX = (100 - margin * 2) / (cols + 1);
                const spacingY = (100 - margin * 2) / (rows + 1);
                let idx = 0;
                for (let r = 0; r < rows && idx < count; r++) {
                    for (let c = 0; c < cols && idx < count; c++) {
                        const x = margin + spacingX * (c + 1);
                        const y = margin + spacingY * (r + 1);
                        // Немного случайного смещения для естественности
                        const jitter = 0.8;
                        positions.push({
                            x: x + (Math.random() - 0.5) * spacingX * jitter,
                            y: y + (Math.random() - 0.5) * spacingY * jitter
                        });
                        idx++;
                    }
                }
                return positions;
            }

            // ---------- Обновление UI кружков ----------
            function updateDotsUI() {
                const dots = dotsContainer.querySelectorAll('.target-dot');
                let doneCount = 0;
                dots.forEach((dot, i) => {
                    dot.className = 'target-dot';
                    if (captured[i]) {
                        dot.classList.add('done');
                        dot.querySelector('.status-icon').textContent = '✅';
                        doneCount++;
                    } else {
                        dot.querySelector('.status-icon').textContent = '⏳';
                    }
                });
                const progress = (doneCount / TOTAL_SHOTS) * 100;
                progressFill.style.width = progress + '%';
                if (doneCount === TOTAL_SHOTS) {
                    updateStatus('✅ Все кадры сняты! Нажми "Завершить"');
                    guideText.textContent = '🎉 Все кружки заполнены!';
                } else {
                    updateStatus(`Снято ${doneCount}/${TOTAL_SHOTS} кадров`);
                }
                return doneCount;
            }

            // ---------- Проверка, находится ли центр экрана на кружке ----------
            function checkDotOverlap() {
                if (!video.videoWidth) return null;
                const rect = video.getBoundingClientRect();
                const cx = rect.width / 2;
                const cy = rect.height / 2;

                const dots = dotsContainer.querySelectorAll('.target-dot');
                let closest = null;
                let minDist = Infinity;

                dots.forEach((dot) => {
                    const i = parseInt(dot.dataset.index);
                    if (captured[i]) return; // уже снято

                    const dotRect = dot.getBoundingClientRect();
                    const dotCx = dotRect.left + dotRect.width / 2;
                    const dotCy = dotRect.top + dotRect.height / 2;
                    const dist = Math.hypot(dotCx - cx, dotCy - cy);
                    const radius = DOT_RADIUS * (rect.width / 800); // адаптивный радиус

                    if (dist < radius && dist < minDist) {
                        minDist = dist;
                        closest = i;
                    }
                });

                return closest;
            }

            // ---------- Съёмка кадра ----------
            async function captureShot(index) {
                if (isCapturing) return false;
                if (captured[index]) return false;
                if (!video.videoWidth) return false;

                isCapturing = true;
                const dot = dotsContainer.querySelector(`.target-dot[data-index="${index}"]`);
                if (dot) dot.classList.add('active');

                updateStatus(`📸 Съёмка кадра ${index + 1}...`);

                // Небольшая задержка для стабилизации
                await new Promise(r => setTimeout(r, CAPTURE_DELAY));

                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    const ctx = canvas.getContext('2d');
                    // Зеркальное отображение (как в видео)
                    ctx.translate(canvas.width, 0);
                    ctx.scale(-1, 1);
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.92));
                    if (!blob) throw new Error('Не удалось создать blob');

                    const url = URL.createObjectURL(blob);
                    photos.push({ blob, url, index });
                    captured[index] = true;

                    if (dot) {
                        dot.classList.remove('active');
                        dot.classList.add('done');
                        dot.querySelector('.status-icon').textContent = '✅';
                    }

                    const doneCount = updateDotsUI();
                    if (doneCount === TOTAL_SHOTS) {
                        guideText.textContent = '🎉 Все кружки заполнены!';
                    }

                    isCapturing = false;
                    return true;
                } catch (err) {
                    console.error('Ошибка съёмки:', err);
                    if (dot) dot.classList.remove('active');
                    isCapturing = false;
                    updateStatus(`❌ Ошибка съёмки кадра ${index + 1}`);
                    return false;
                }
            }

            // ---------- Автоматический режим ----------
            function startAutoMode() {
                if (isAutoMode) {
                    stopAutoMode();
                    return;
                }
                if (captured.every(v => v === true)) {
                    updateStatus('Все кадры уже сняты!');
                    return;
                }
                isAutoMode = true;
                btnAuto.textContent = '⏹ Стоп';
                btnAuto.classList.add('btn-danger');
                btnAuto.classList.remove('btn-primary');
                updateStatus('🔄 Авторежим: наводи на кружки...');
                guideText.textContent = '🔄 Авторежим активен';

                autoTimer = setInterval(async () => {
                    if (isCapturing) return;
                    const nextIndex = captured.findIndex(v => v === false);
                    if (nextIndex === -1) {
                        stopAutoMode();
                        updateStatus('✅ Все кадры сняты!');
                        guideText.textContent = '🎉 Готово!';
                        return;
                    }
                    const target = checkDotOverlap();
                    if (target !== null && !captured[target]) {
                        await captureShot(target);
                        // Проверяем, не закончились ли кадры
                        if (captured.every(v => v === true)) {
                            stopAutoMode();
                            updateStatus('✅ Все кадры сняты!');
                            guideText.textContent = '🎉 Готово!';
                        }
                    }
                }, 400);
            }

            function stopAutoMode() {
                isAutoMode = false;
                if (autoTimer) {
                    clearInterval(autoTimer);
                    autoTimer = null;
                }
                btnAuto.textContent = '▶ Авто';
                btnAuto.classList.remove('btn-danger');
                btnAuto.classList.add('btn-primary');
                updateStatus('Авторежим остановлен');
                guideText.textContent = '📸 Наведи камеру на кружок → автосъёмка';
            }

            // ---------- Сборка панорамы (простейшая склейка по порядку) ----------
            function buildPanorama() {
                if (photos.length === 0) return null;
                
                // Сортируем по индексу
                const sorted = [...photos].sort((a, b) => a.index - b.index);
                
                // Создаём широкую панораму: склеиваем все кадры горизонтально
                // Для простоты берём высоту первого кадра, а ширину суммируем
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // Загружаем все изображения
                const imgs = [];
                let totalWidth = 0;
                let maxHeight = 0;
                
                return new Promise((resolve) => {
                    let loaded = 0;
                    sorted.forEach((photo, idx) => {
                        const img = new Image();
                        img.onload = function() {
                            imgs[idx] = img;
                            totalWidth += img.width;
                            maxHeight = Math.max(maxHeight, img.height);
                            loaded++;
                            if (loaded === sorted.length) {
                                // Все загружены — рисуем
                                canvas.width = totalWidth;
                                canvas.height = maxHeight;
                                let x = 0;
                                for (let i = 0; i < imgs.length; i++) {
                                    const img = imgs[i];
                                    if (!img) continue;
                                    const y = (maxHeight - img.height) / 2;
                                    ctx.drawImage(img, x, y, img.width, img.height);
                                    x += img.width;
                                }
                                canvas.toBlob((blob) => {
                                    if (blob) {
                                        const url = URL.createObjectURL(blob);
                                        resolve({ blob, url, canvas });
                                    } else {
                                        resolve(null);
                                    }
                                }, 'image/jpeg', 0.85);
                            }
                        };
                        img.onerror = function() {
                            loaded++;
                            if (loaded === sorted.length && imgs.every(v => v !== undefined)) {
                                // fallback
                                resolve(null);
                            }
                        };
                        img.src = photo.url;
                    });
                });
            }

            // ---------- Показать результат ----------
            async function showResult() {
                if (photos.length === 0) {
                    alert('Сначала сделайте хотя бы один снимок!');
                    return;
                }

                updateStatus('🔄 Собираем панораму...');
                const panorama = await buildPanorama();
                if (panorama) {
                    panoramaImg.src = panorama.url;
                } else {
                    // fallback: показать первое фото
                    panoramaImg.src = photos[0].url;
                }

                // Показать все миниатюры
                thumbnailsDiv.innerHTML = '';
                const sorted = [...photos].sort((a, b) => a.index - b.index);
                sorted.forEach((photo) => {
                    const img = document.createElement('img');
                    img.src = photo.url;
                    img.title = `Кадр ${photo.index + 1}`;
                    img.onclick = () => window.open(photo.url, '_blank');
                    thumbnailsDiv.appendChild(img);
                });

                resultPanel.classList.add('show');
                updateStatus('✅ Панорама готова!');
            }

            // ---------- Скачать все файлы (ZIP) ----------
            function downloadAll() {
                if (photos.length === 0) {
                    alert('Нет фото для скачивания');
                    return;
                }
                // Для простоты — скачиваем по отдельности (создаём ZIP через JSZip?)
                // Без внешних библиотек — просто скачиваем каждый файл
                // Но пользователю удобнее одним архивом. Используем простой подход:
                // если есть возможность, используем JSZip, но для простоты — скачиваем панораму и все фото отдельно.
                // Сделаем простую утилиту: скачиваем панораму и все фото в папку.
                // Просто скачаем панораму и все фото по очереди с задержкой.
                const panoramaUrl = panoramaImg.src;
                if (panoramaUrl && panoramaUrl !== '') {
                    downloadFile(panoramaUrl, 'panorama_360.jpg');
                }
                // Скачиваем все оригиналы
                const sorted = [...photos].sort((a, b) => a.index - b.index);
                sorted.forEach((photo, i) => {
                    setTimeout(() => {
                        downloadFile(photo.url, `photo_${String(i+1).padStart(2,'0')}.jpg`);
                    }, i * 300);
                });
                updateStatus('📥 Начато скачивание файлов...');
            }

            function downloadFile(url, filename) {
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }

            // ---------- Сброс ----------
            function resetAll() {
                stopAutoMode();
                // Освобождаем blob URL
                photos.forEach(p => URL.revokeObjectURL(p.url));
                photos = [];
                captured = new Array(TOTAL_SHOTS).fill(false);
                isCapturing = false;
                resultPanel.classList.remove('show');
                generateDots();
                updateDotsUI();
                updateStatus('🔄 Сброшено. Начинай заново!');
                guideText.textContent = '📸 Наведи камеру на кружок → автосъёмка';
                progressFill.style.width = '0%';
            }

            // ---------- Обновление статуса ----------
            function updateStatus(text) {
                statusText.textContent = text;
            }

            // ---------- Обработчики ----------
            btnReset.addEventListener('click', resetAll);
            btnAuto.addEventListener('click', startAutoMode);
            btnFinish.addEventListener('click', showResult);
            btnCloseResult.addEventListener('click', () => {
                resultPanel.classList.remove('show');
            });
            btnDownloadAll.addEventListener('click', downloadAll);

            // Ручная съёмка по клику на экран (если авто выключен)
            document.getElementById('camera-container').addEventListener('click', async (e) => {
                if (isAutoMode) return;
                if (isCapturing) return;
                const target = checkDotOverlap();
                if (target !== null && !captured[target]) {
                    await captureShot(target);
                    updateDotsUI();
                } else {
                    // Подсказка
                    const done = captured.filter(v => v).length;
                    if (done < TOTAL_SHOTS) {
                        updateStatus('🔍 Наведи камеру на незаполненный кружок');
                    }
                }
            });

            // Для мобильных: touch
            document.getElementById('camera-container').addEventListener('touchstart', (e) => {
                // предотвращаем только если не авто
                if (isAutoMode) return;
                // имитируем клик
                const touch = e.touches[0];
                const target = checkDotOverlap();
                if (target !== null && !captured[target]) {
                    e.preventDefault();
                    captureShot(target);
                    updateDotsUI();
                }
            }, { passive: false });

            // ---------- Запуск ----------
            async function init() {
                const ok = await initCamera();
                if (ok) {
                    // Добавляем дебаг: если камера есть, стартуем
                    updateStatus('📸 Готов. Наведи на кружок!');
                }
            }

            init();

            // Обработка закрытия страницы
            window.addEventListener('beforeunload', () => {
                if (videoStream) {
                    videoStream.getTracks().forEach(track => track.stop());
                }
                photos.forEach(p => URL.revokeObjectURL(p.url));
            });

        })();
    </script>
</body>
</html>
