<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>360 Панорама - Гироскоп</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            position: fixed;
        }
        #camera-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Убрал зеркалирование! */
            transform: scaleX(1);
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.6) 100%);
            z-index: 2;
        }
        /* Центральный прицел */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            pointer-events: none;
            width: 60px;
            height: 60px;
        }
        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(0, 255, 136, 0.8);
        }
        #crosshair::before {
            width: 2px;
            height: 100%;
            left: 50%;
            transform: translateX(-50%);
        }
        #crosshair::after {
            width: 100%;
            height: 2px;
            top: 50%;
            transform: translateY(-50%);
        }
        #crosshair .circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            border: 2px solid rgba(0, 255, 136, 0.5);
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
            50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.3; }
        }

        /* Кружки */
        .target-dot {
            position: absolute;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.08);
            width: 70px;
            height: 70px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            box-shadow: 0 0 30px rgba(0, 150, 255, 0.15);
            transition: all 0.15s ease;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: rgba(255,255,255,0.8);
            font-weight: bold;
            text-shadow: 0 0 20px rgba(0,0,0,0.9);
            backdrop-filter: blur(2px);
            will-change: transform, opacity;
        }
        .target-dot .num {
            font-size: 22px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 20px rgba(0,0,0,0.9);
            z-index: 2;
        }
        .target-dot .bg-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,200,255,0.1), transparent 70%);
            z-index: 0;
        }
        .target-dot .status-icon {
            position: absolute;
            bottom: -28px;
            font-size: 14px;
            background: rgba(0,0,0,0.7);
            padding: 2px 12px;
            border-radius: 12px;
            white-space: nowrap;
            z-index: 3;
            backdrop-filter: blur(5px);
        }
        .target-dot .angle-label {
            position: absolute;
            top: -28px;
            font-size: 10px;
            color: rgba(255,255,255,0.4);
            background: rgba(0,0,0,0.5);
            padding: 2px 8px;
            border-radius: 10px;
            white-space: nowrap;
        }
        .target-dot.active {
            border-color: #00ff88;
            background: rgba(0, 255, 136, 0.2);
            box-shadow: 0 0 60px rgba(0, 255, 136, 0.4);
            transform: translate(-50%, -50%) scale(1.15);
        }
        .target-dot.done {
            border-color: #00ff88;
            background: rgba(0, 255, 136, 0.2);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.15);
            opacity: 0.5;
        }
        .target-dot.done .num {
            opacity: 0.5;
        }

        /* UI */
        #ui {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 20;
            pointer-events: none;
            padding: 0 16px;
        }
        #ui > * {
            pointer-events: auto;
        }
        #progress-bar {
            width: 90%;
            max-width: 350px;
            height: 5px;
            background: rgba(255,255,255,0.15);
            border-radius: 3px;
            overflow: hidden;
        }
        #progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00ff88, #00ccff);
            border-radius: 3px;
            transition: width 0.3s ease;
        }
        #status-text {
            font-size: 13px;
            color: rgba(255,255,255,0.8);
            background: rgba(0,0,0,0.6);
            padding: 6px 18px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            font-weight: 500;
            text-align: center;
            min-height: 32px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        #btn-panel {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            pointer-events: auto;
        }
        .btn {
            padding: 10px 22px;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            background: rgba(255,255,255,0.08);
            color: #fff;
            border: 2px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            min-width: 90px;
            touch-action: manipulation;
        }
        .btn:active {
            transform: scale(0.93);
        }
        .btn-primary {
            background: #00ccff;
            color: #000;
            border-color: #00ccff;
            box-shadow: 0 0 25px rgba(0, 204, 255, 0.25);
        }
        .btn-success {
            background: #00ff88;
            color: #000;
            border-color: #00ff88;
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.25);
        }
        .btn-danger {
            background: #ff4466;
            color: #fff;
            border-color: #ff4466;
            box-shadow: 0 0 25px rgba(255, 68, 102, 0.25);
        }
        .btn-warning {
            background: #ffaa00;
            color: #000;
            border-color: #ffaa00;
            box-shadow: 0 0 25px rgba(255, 170, 0, 0.25);
        }
        .btn:disabled {
            opacity: 0.3;
            pointer-events: none;
        }

        #gyro-indicator {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 15;
            background: rgba(0,0,0,0.6);
            padding: 6px 14px;
            border-radius: 15px;
            font-size: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.08);
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #gyro-indicator .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            transition: background 0.3s;
        }
        #gyro-indicator .dot.active {
            background: #00ff88;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
        }
        #gyro-indicator .dot.inactive {
            background: #ff4466;
            box-shadow: 0 0 15px rgba(255, 68, 102, 0.3);
        }

        /* Отладка */
        #debug {
            position: absolute;
            bottom: 100px;
            left: 10px;
            z-index: 25;
            font-size: 11px;
            color: rgba(255,255,255,0.5);
            background: rgba(0,0,0,0.5);
            padding: 4px 10px;
            border-radius: 8px;
            font-family: monospace;
            pointer-events: none;
            display: none;
        }

        /* Результат */
        #result-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            overflow-y: auto;
            backdrop-filter: blur(20px);
        }
        #result-panel.show {
            display: flex;
        }
        #result-panel h2 {
            font-size: 26px;
            margin-bottom: 6px;
            background: linear-gradient(90deg, #00ff88, #00ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #result-panel .sub {
            color: rgba(255,255,255,0.5);
            font-size: 13px;
            margin-bottom: 16px;
        }
        #panorama-result {
            max-width: 100%;
            max-height: 35vh;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.08);
            margin-bottom: 16px;
            object-fit: contain;
            background: #111;
        }
        #thumbnails {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            max-width: 500px;
            max-height: 25vh;
            overflow-y: auto;
            padding: 10px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
        }
        #thumbnails img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid rgba(255,255,255,0.08);
            transition: transform 0.2s;
            cursor: pointer;
        }
        #result-btns {
            display: flex;
            gap: 12px;
            margin-top: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn-close {
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            color: #fff;
        }
        .btn-download {
            background: #00ff88;
            color: #000;
            border-color: #00ff88;
        }

        @media (max-width: 600px) {
            .target-dot {
                width: 56px;
                height: 56px;
            }
            .target-dot .num {
                font-size: 18px;
            }
            .target-dot .status-icon {
                font-size: 12px;
                bottom: -24px;
                padding: 1px 10px;
            }
            .btn {
                padding: 8px 16px;
                font-size: 12px;
                min-width: 70px;
            }
            #gyro-indicator {
                font-size: 10px;
                padding: 4px 10px;
                top: 10px;
                right: 10px;
            }
            #crosshair {
                width: 44px;
                height: 44px;
            }
            #crosshair .circle {
                width: 34px;
                height: 34px;
            }
        }
    </style>
</head>
<body>

    <div id="camera-container">
        <video id="video" autoplay playsinline></video>
        <div id="overlay"></div>
        
        <div id="crosshair">
            <div class="circle"></div>
        </div>

        <div id="dots-container"></div>

        <div id="gyro-indicator">
            <span>🔄 Гироскоп</span>
            <span class="dot inactive" id="gyro-dot"></span>
            <span id="gyro-status">⏳</span>
        </div>

        <div id="debug"></div>

        <div id="ui">
            <div id="progress-bar">
                <div id="progress-fill"></div>
            </div>
            <div id="status-text">📱 Поворачивай телефон, чтобы найти кружки</div>
            <div id="btn-panel">
                <button class="btn btn-danger" id="btn-reset">↺ Сброс</button>
                <button class="btn btn-warning" id="btn-auto">🎯 Авто</button>
                <button class="btn btn-success" id="btn-finish">✅ Готово</button>
            </div>
        </div>
    </div>

    <div id="result-panel">
        <h2>🎉 Панорама готова!</h2>
        <p class="sub" id="result-info">Склеено кадров: 0</p>
        <img id="panorama-result" src="" alt="Панорама">
        <div id="thumbnails"></div>
        <div id="result-btns">
            <button class="btn btn-download" id="btn-download-all">📥 Скачать всё</button>
            <button class="btn btn-close" id="btn-close-result">✕ Закрыть</button>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ---------- КОНФИГ ----------
            const TOTAL_SHOTS = 10;
            const CAPTURE_DELAY = 300;
            const CAPTURE_RADIUS = 0.08; // 8% от размера экрана

            // ---------- СОСТОЯНИЕ ----------
            let photos = [];
            let captured = new Array(TOTAL_SHOTS).fill(false);
            let videoStream = null;
            let isAutoMode = false;
            let isCapturing = false;
            let gyroAvailable = false;
            let lastCaptureAttempt = 0;

            // Данные гироскопа
            let currentAlpha = 0;
            let currentBeta = 0;
            let screenOrientation = 0;
            let dotPositions = [];

            // DOM
            const video = document.getElementById('video');
            const dotsContainer = document.getElementById('dots-container');
            const progressFill = document.getElementById('progress-fill');
            const statusText = document.getElementById('status-text');
            const btnReset = document.getElementById('btn-reset');
            const btnAuto = document.getElementById('btn-auto');
            const btnFinish = document.getElementById('btn-finish');
            const resultPanel = document.getElementById('result-panel');
            const panoramaImg = document.getElementById('panorama-result');
            const thumbnailsDiv = document.getElementById('thumbnails');
            const btnCloseResult = document.getElementById('btn-close-result');
            const btnDownloadAll = document.getElementById('btn-download-all');
            const gyroDot = document.getElementById('gyro-dot');
            const gyroStatus = document.getElementById('gyro-status');
            const debugEl = document.getElementById('debug');
            const resultInfo = document.getElementById('result-info');

            // ---------- ГЕНЕРАЦИЯ ТОЧЕК ----------
            function generateSpherePoints(count) {
                const points = [];
                const phi = Math.PI * (3 - Math.sqrt(5));
                for (let i = 0; i < count; i++) {
                    const y = 1 - (i / (count - 1)) * 2;
                    const radius = Math.sqrt(1 - y * y);
                    const theta = phi * i;
                    const x = Math.cos(theta) * radius;
                    const z = Math.sin(theta) * radius;
                    const alpha = (Math.atan2(z, x) * 180 / Math.PI + 360) % 360;
                    const beta = Math.asin(y) * 180 / Math.PI;
                    points.push({ alpha, beta });
                }
                return points;
            }

            // ---------- ИНИЦИАЛИЗАЦИЯ КАМЕРЫ ----------
            async function initCamera() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { 
                            facingMode: 'environment',
                            width: { ideal: 1280 },
                            height: { ideal: 720 }
                        },
                        audio: false
                    });
                    videoStream = stream;
                    video.srcObject = stream;
                    await video.play();
                    
                    dotPositions = generateSpherePoints(TOTAL_SHOTS);
                    createDots();
                    
                    updateStatus('📱 Поворачивай телефон!');
                    return true;
                } catch (err) {
                    console.error('Ошибка камеры:', err);
                    updateStatus('❌ Нет доступа к камере');
                    alert('Разреши доступ к камере и обнови страницу');
                    return false;
                }
            }

            // ---------- СОЗДАНИЕ КРУЖКОВ ----------
            function createDots() {
                dotsContainer.innerHTML = '';
                for (let i = 0; i < TOTAL_SHOTS; i++) {
                    const dot = document.createElement('div');
                    dot.className = 'target-dot';
                    dot.dataset.index = i;
                    dot.dataset.alpha = dotPositions[i].alpha;
                    dot.dataset.beta = dotPositions[i].beta;
                    dot.style.display = 'none';
                    dot.innerHTML = `
                        <div class="bg-glow"></div>
                        <span class="num">${i + 1}</span>
                        <span class="angle-label">${Math.round(dotPositions[i].alpha)}°</span>
                        <span class="status-icon">⏳</span>
                    `;
                    dotsContainer.appendChild(dot);
                }
            }

            // ---------- ОБНОВЛЕНИЕ ПОЗИЦИЙ КРУЖКОВ ----------
            function updateDotsPosition(alpha, beta) {
                const dots = dotsContainer.querySelectorAll('.target-dot');
                const container = document.getElementById('camera-container');
                const rect = container.getBoundingClientRect();
                const w = rect.width;
                const h = rect.height;
                const fov = 60;

                let anyVisible = false;
                const captureRadius = Math.min(w, h) * CAPTURE_RADIUS;

                dots.forEach((dot) => {
                    const dotAlpha = parseFloat(dot.dataset.alpha);
                    const dotBeta = parseFloat(dot.dataset.beta);

                    let diffAlpha = dotAlpha - alpha;
                    if (diffAlpha > 180) diffAlpha -= 360;
                    if (diffAlpha < -180) diffAlpha += 360;
                    const diffBeta = dotBeta - beta;

                    const halfFov = fov / 2;
                    const inView = Math.abs(diffAlpha) < halfFov && Math.abs(diffBeta) < halfFov;

                    if (inView) {
                        anyVisible = true;
                        const px = (diffAlpha / fov) * w + w / 2;
                        const py = (diffBeta / fov) * h + h / 2;
                        
                        const margin = 30;
                        const clampedX = Math.max(margin, Math.min(w - margin, px));
                        const clampedY = Math.max(margin, Math.min(h - margin, py));
                        
                        dot.style.display = 'flex';
                        dot.style.left = clampedX + 'px';
                        dot.style.top = clampedY + 'px';
                        
                        const distFromCenter = Math.hypot(
                            (clampedX - w/2) / (w/2),
                            (clampedY - h/2) / (h/2)
                        );
                        const scale = 0.7 + 0.6 * (1 - Math.min(distFromCenter, 1));
                        dot.style.transform = `translate(-50%, -50%) scale(${scale})`;
                        
                        // Проверка попадания в центр
                        const crossX = w / 2;
                        const crossY = h / 2;
                        const dist = Math.hypot(clampedX - crossX, clampedY - crossY);
                        
                        const idx = parseInt(dot.dataset.index);
                        if (dist < captureRadius && !captured[idx]) {
                            dot.classList.add('active');
                            
                            // Автосъёмка
                            if (isAutoMode && !isCapturing) {
                                const now = Date.now();
                                if (now - lastCaptureAttempt > 500) {
                                    lastCaptureAttempt = now;
                                    captureShot(idx);
                                }
                            }
                        } else {
                            dot.classList.remove('active');
                        }
                    } else {
                        dot.style.display = 'none';
                    }
                });

                // Обновляем отладку
                if (debugEl.style.display !== 'none') {
                    debugEl.textContent = `α:${Math.round(alpha)}° β:${Math.round(beta)}°`;
                }

                return anyVisible;
            }

            // ---------- СЪЁМКА ----------
            async function captureShot(index) {
                if (isCapturing) return false;
                if (captured[index]) return false;
                if (!video.videoWidth || !video.videoHeight) return false;

                isCapturing = true;
                const dot = dotsContainer.querySelector(`.target-dot[data-index="${index}"]`);
                if (dot) {
                    dot.classList.add('active');
                    dot.querySelector('.status-icon').textContent = '📸';
                }

                updateStatus(`📸 Съёмка ${index + 1}/${TOTAL_SHOTS}...`);

                // Небольшая задержка для стабилизации
                await new Promise(r => setTimeout(r, CAPTURE_DELAY));

                try {
                    const canvas = document.createElement('canvas');
                    // Используем реальные размеры видео
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    const ctx = canvas.getContext('2d');
                    // НЕ зеркалируем!
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                    const blob = await new Promise(resolve => {
                        canvas.toBlob(resolve, 'image/jpeg', 0.92);
                    });
                    
                    if (!blob) throw new Error('Не удалось создать blob');

                    const url = URL.createObjectURL(blob);
                    photos.push({ blob, url, index });
                    captured[index] = true;

                    if (dot) {
                        dot.classList.remove('active');
                        dot.classList.add('done');
                        dot.querySelector('.status-icon').textContent = '✅';
                    }

                    updateProgress();
                    isCapturing = false;
                    
                    if (captured.every(v => v === true)) {
                        updateStatus('🎉 Все кадры сняты! Нажми "Готово"');
                        if (isAutoMode) stopAutoMode();
                    } else {
                        const done = captured.filter(v => v).length;
                        updateStatus(`📱 ${done}/${TOTAL_SHOTS} — продолжай поворачивать`);
                    }
                    
                    return true;
                } catch (err) {
                    console.error('Ошибка съёмки:', err);
                    if (dot) {
                        dot.classList.remove('active');
                        dot.querySelector('.status-icon').textContent = '❌';
                    }
                    isCapturing = false;
                    updateStatus(`❌ Ошибка кадра ${index + 1}`);
                    return false;
                }
            }

            // ---------- РУЧНАЯ СЪЁМКА ПО ТАПУ ----------
            function handleTap(e) {
                if (isAutoMode) return;
                if (isCapturing) return;
                
                const container = document.getElementById('camera-container');
                const rect = container.getBoundingClientRect();
                let cx, cy;
                
                if (e.touches) {
                    cx = e.touches[0].clientX - rect.left;
                    cy = e.touches[0].clientY - rect.top;
                    e.preventDefault();
                } else {
                    cx = e.clientX - rect.left;
                    cy = e.clientY - rect.top;
                }
                
                const dots = dotsContainer.querySelectorAll('.target-dot');
                let closest = null;
                let minDist = Infinity;
                
                dots.forEach((dot) => {
                    if (dot.style.display === 'none') return;
                    const idx = parseInt(dot.dataset.index);
                    if (captured[idx]) return;
                    
                    const left = parseFloat(dot.style.left);
                    const top = parseFloat(dot.style.top);
                    const dist = Math.hypot(left - cx, top - cy);
                    if (dist < 60 && dist < minDist) {
                        minDist = dist;
                        closest = idx;
                    }
                });
                
                if (closest !== null && !captured[closest]) {
                    captureShot(closest);
                }
            }

            // ---------- ПРОГРЕСС ----------
            function updateProgress() {
                const done = captured.filter(v => v).length;
                const progress = (done / TOTAL_SHOTS) * 100;
                progressFill.style.width = progress + '%';
            }

            // ---------- АВТОРЕЖИМ ----------
            function startAutoMode() {
                if (isAutoMode) {
                    stopAutoMode();
                    return;
                }
                if (captured.every(v => v === true)) {
                    updateStatus('Все кадры уже сняты!');
                    return;
                }
                isAutoMode = true;
                btnAuto.textContent = '⏹ Стоп';
                btnAuto.classList.remove('btn-warning');
                btnAuto.classList.add('btn-danger');
                updateStatus('🎯 Авторежим: просто поворачивай телефон');
            }

            function stopAutoMode() {
                isAutoMode = false;
                btnAuto.textContent = '🎯 Авто';
                btnAuto.classList.remove('btn-danger');
                btnAuto.classList.add('btn-warning');
                const done = captured.filter(v => v).length;
                if (done < TOTAL_SHOTS) {
                    updateStatus(`📱 ${done}/${TOTAL_SHOTS} — поворачивай телефон`);
                }
            }

            // ---------- ГИРОСКОП ----------
            function initGyroscope() {
                if (typeof DeviceOrientationEvent === 'undefined') {
                    updateStatus('❌ Гироскоп не поддерживается');
                    gyroStatus.textContent = '❌';
                    fallbackToMouse();
                    return;
                }

                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission()
                        .then(state => {
                            if (state === 'granted') {
                                window.addEventListener('deviceorientation', handleOrientation);
                                gyroAvailable = true;
                                gyroDot.className = 'dot active';
                                gyroStatus.textContent = '✅';
                                updateStatus('✅ Гироскоп активен! Поворачивай телефон');
                                debugEl.style.display = 'block';
                            } else {
                                updateStatus('❌ Доступ к гироскопу запрещён');
                                gyroStatus.textContent = '🚫';
                                fallbackToMouse();
                            }
                        })
                        .catch(err => {
                            console.error('Ошибка:', err);
                            fallbackToMouse();
                        });
                } else {
                    window.addEventListener('deviceorientation', handleOrientation);
                    gyroAvailable = true;
                    gyroDot.className = 'dot active';
                    gyroStatus.textContent = '✅';
                    updateStatus('✅ Гироскоп активен! Поворачивай телефон');
                    debugEl.style.display = 'block';
                    
                    setTimeout(() => {
                        if (!gyroAvailable) {
                            fallbackToMouse();
                        }
                    }, 3000);
                }

                window.addEventListener('orientationchange', () => {
                    screenOrientation = screen.orientation?.angle || 0;
                });
                screenOrientation = screen.orientation?.angle || 0;
            }

            function handleOrientation(event) {
                let alpha = event.alpha || 0;
                let beta = event.beta || 0;
                let gamma = event.gamma || 0;

                // Компенсация поворота экрана
                const angle = screenOrientation || 0;
                if (angle === 90) {
                    const temp = alpha;
                    alpha = (gamma + 360) % 360;
                    gamma = -temp;
                } else if (angle === -90 || angle === 270) {
                    const temp = alpha;
                    alpha = (gamma + 360) % 360;
                    gamma = temp;
                }

                currentAlpha = (alpha + 360) % 360;
                currentBeta = Math.max(-90, Math.min(90, beta));

                updateDotsPosition(currentAlpha, currentBeta);
            }

            // ---------- ФОЛБЭК ----------
            function fallbackToMouse() {
                updateStatus('🖱️ Гироскоп недоступен. Используй тап по кружкам');
                gyroDot.className = 'dot inactive';
                gyroStatus.textContent = '🖱️';
                
                const dots = dotsContainer.querySelectorAll('.target-dot');
                const container = document.getElementById('camera-container');
                const rect = container.getBoundingClientRect();
                const w = rect.width;
                const h = rect.height;
                
                const cols = Math.ceil(Math.sqrt(TOTAL_SHOTS));
                const rows = Math.ceil(TOTAL_SHOTS / cols);
                const margin = 8;
                const spacingX = (100 - margin * 2) / (cols + 1);
                const spacingY = (100 - margin * 2) / (rows + 1);
                
                dots.forEach((dot, i) => {
                    const r = Math.floor(i / cols);
                    const c = i % cols;
                    const x = margin + spacingX * (c + 1);
                    const y = margin + spacingY * (r + 1);
                    dot.style.display = 'flex';
                    dot.style.left = (x / 100 * w) + 'px';
                    dot.style.top = (y / 100 * h) + 'px';
                    dot.style.transform = 'translate(-50%, -50%) scale(0.9)';
                });
            }

            // ---------- ПАНОРАМА ----------
            function buildPanorama() {
                if (photos.length === 0) return null;
                
                const sorted = [...photos].sort((a, b) => a.index - b.index);
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                return new Promise((resolve) => {
                    const imgs = [];
                    let totalWidth = 0;
                    let maxHeight = 0;
                    let loaded = 0;
                    
                    sorted.forEach((photo, idx) => {
                        const img = new Image();
                        img.onload = function() {
                            imgs[idx] = img;
                            totalWidth += img.width;
                            maxHeight = Math.max(maxHeight, img.height);
                            loaded++;
                            if (loaded === sorted.length) {
                                canvas.width = totalWidth;
                                canvas.height = maxHeight;
                                let x = 0;
                                for (let i = 0; i < imgs.length; i++) {
                                    const img = imgs[i];
                                    if (!img) continue;
                                    const y = (maxHeight - img.height) / 2;
                                    ctx.drawImage(img, x, y, img.width, img.height);
                                    x += img.width;
                                }
                                canvas.toBlob((blob) => {
                                    if (blob) {
                                        const url = URL.createObjectURL(blob);
                                        resolve({ blob, url, canvas });
                                    } else {
                                        resolve(null);
                                    }
                                }, 'image/jpeg', 0.85);
                            }
                        };
                        img.onerror = function() {
                            loaded++;
                            if (loaded === sorted.length) {
                                resolve(null);
                            }
                        };
                        img.src = photo.url;
                    });
                });
            }

            // ---------- РЕЗУЛЬТАТ ----------
            async function showResult() {
                if (photos.length === 0) {
                    alert('Сначала сделай хотя бы один кадр!');
                    return;
                }
                
                updateStatus('🔄 Собираю панораму...');
                const panorama = await buildPanorama();
                if (panorama) {
                    panoramaImg.src = panorama.url;
                } else {
                    panoramaImg.src = photos[0].url;
                }
                
                resultInfo.textContent = `Склеено кадров: ${photos.length} из ${TOTAL_SHOTS}`;
                
                thumbnailsDiv.innerHTML = '';
                const sorted = [...photos].sort((a, b) => a.index - b.index);
                sorted.forEach((photo) => {
                    const img = document.createElement('img');
                    img.src = photo.url;
                    img.title = `Кадр ${photo.index + 1}`;
                    img.onclick = () => window.open(photo.url, '_blank');
                    thumbnailsDiv.appendChild(img);
                });
                
                resultPanel.classList.add('show');
                updateStatus('✅ Панорама готова!');
            }

            // ---------- СКАЧИВАНИЕ ----------
            function downloadAll() {
                if (photos.length === 0) return;
                
                const panoramaUrl = panoramaImg.src;
                if (panoramaUrl && panoramaUrl !== '' && !panoramaUrl.startsWith('data:')) {
                    downloadFile(panoramaUrl, 'panorama_360.jpg');
                }
                
                const sorted = [...photos].sort((a, b) => a.index - b.index);
                sorted.forEach((photo, i) => {
                    setTimeout(() => {
                        downloadFile(photo.url, `photo_${String(i+1).padStart(2,'0')}.jpg`);
                    }, i * 200);
                });
                updateStatus('📥 Скачивание...');
            }

            function downloadFile(url, filename) {
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }

            // ---------- СБРОС ----------
            function resetAll() {
                stopAutoMode();
                photos.forEach(p => URL.revokeObjectURL(p.url));
                photos = [];
                captured = new Array(TOTAL_SHOTS).fill(false);
                isCapturing = false;
                resultPanel.classList.remove('show');
                createDots();
                progressFill.style.width = '0%';
                updateStatus('🔄 Сброшено. Поворачивай телефон!');
            }

            function updateStatus(text) {
                statusText.textContent = text;
            }

            // ---------- СОБЫТИЯ ----------
            btnReset.addEventListener('click', resetAll);
            btnAuto.addEventListener('click', startAutoMode);
            btnFinish.addEventListener('click', showResult);
            btnCloseResult.addEventListener('click', () => resultPanel.classList.remove('show'));
            btnDownloadAll.addEventListener('click', downloadAll);

            // Тап по экрану для ручной съёмки
            document.getElementById('camera-container').addEventListener('click', handleTap);
            document.getElementById('camera-container').addEventListener('touchstart', handleTap, { passive: false });

            // ---------- ЗАПУСК ----------
            async function init() {
                const ok = await initCamera();
                if (ok) {
                    initGyroscope();
                    updateProgress();
                }
            }

            init();

            window.addEventListener('beforeunload', () => {
                if (videoStream) {
                    videoStream.getTracks().forEach(track => track.stop());
                }
                photos.forEach(p => URL.revokeObjectURL(p.url));
            });

        })();
    </script>
</body>
</html>
